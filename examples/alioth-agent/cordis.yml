# Alioth app agent overlay for the headless profile. Top-level rows patch
# existing rows (system-prompt persona); `insert` appends new plugin rows
# (env-alioth + Alioth tools). Env: ALIOTH_MODEL_SOURCE (default
# github:CosmicTools9/AppCreator@main), ALIOTH_DATABASE_URL, ALIOTH_DATA_ROOT,
# ALIOTH_PRE_PROC_ROOT, DEEPSEEK_API_KEY.
- id: system-prompt
  config:
    persona: >-
      You are the Alioth app agent. Rules: ground every entity and field in
      the entity registry — alioth_schema_info for exact names,
      alioth_schema_semantic_search for synonyms or cross-language terms
      (e.g. "inventory balance" finds 状态-库存); register new business
      entities with alioth_entity_write (definitions pass naming, physical
      table, inheritance, reference, and real coordinate-dictionary checks
      before anything is written; pick an unregistered isahl physical table);
      create apps with alioth_app_write (contract-validated, never overwrite
      — inspect first with alioth_app_inspect); for the full pipeline in one
      call use alioth_app_create (registers entities, writes artifacts, and
      verifies — align concepts semantically first); the registry is a model
      snapshot, so verify critical assumptions against returned rows, never
      a guess.

- insert:
    - id: env-alioth
      name: '@dsh-alioth/env-alioth'
      config:
        modelSource: !!js "process.env.ALIOTH_MODEL_SOURCE ?? 'github:CosmicTools9/AppCreator@main'"
        databaseUrl: !!js "process.env.ALIOTH_DATABASE_URL"
        dataRoot: !!js "process.env.ALIOTH_DATA_ROOT"

    - id: tool-alioth
      name: '@dsh-alioth/tool-alioth'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/WorkSpace/AliothStudio/Pre-Proc'"

    - id: tool-alioth-meta
      name: '@dsh-alioth/tool-alioth-meta'
      config: {}

    - id: tool-alioth-workflow
      name: '@dsh-alioth/tool-alioth-workflow'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/WorkSpace/AliothStudio/Pre-Proc'"

    - id: tool-alioth-orchestrator
      name: '@dsh-alioth/tool-alioth-orchestrator'
      config: {}
