# One-shot Alioth app-inspection agent. Mounts the alioth_app_inspect tool into
# the headless composition so the model reads real Pre-Proc artifacts before
# creating or extending apps (AppCreator capability). Requires ALIOTH_PRE_PROC_ROOT
# (defaults to ~/WorkSpace/AliothStudio/Pre-Proc) and, for a live run,
# DEEPSEEK_API_KEY.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-pro
        contextWindow: 128000
      - id: deepseek-v4-flash
        contextWindow: 128000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    persona: |
      You are the Alioth app agent. Inspect existing Alioth apps with
      alioth_app_inspect before proposing any change; ground every answer
      in the returned artifact, never a guess.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-alioth
  name: '@dsh-alioth/tool-alioth'
  config:
    preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/WorkSpace/AliothStudio/Pre-Proc'"
