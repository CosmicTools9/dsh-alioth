packages:
  - 'packages/*/*'
  - 'examples/*'
  # Host harness source tree (same pattern as deepseek-harness including
  # ../dsh-chess): @deepseek-ai devDependencies resolve to the local checkout
  # instead of npm when it is present. Absent (CI without the sibling), the
  # glob is empty and the registry versions below apply.
  - '../deepseek-harness/packages/*/*'
  # Harness vendor tier: @deepseek-ai/cordis + plugin family + schemastery /
  # cosmokit live here, referenced workspace:^ from harness packages.
  - '../deepseek-harness/vendor/*'
  # Harness app tier: dsh-web-frontend ships from apps/web.
  - '../deepseek-harness/apps/*'
  # Harness native tier: node-addon-landlock-run referenced workspace:^ (the
  # real package lives under packages/entry; the landlock-run root is its
  # workspace-shim that the harness itself also lists).
  - '../deepseek-harness/native/landlock-run/packages/*'
  - '../deepseek-harness/native/system/packages/*'

# Link harness source packages when the declared version matches (same
# setting the harness workspace uses for its sibling checkouts).
linkWorkspacePackages: true

# Security floors for transitive deps (audit gate). pnpm 11 reads settings
# here, not from package.json#pnpm.
overrides:
  # Alioth stack alignment: resolve the embedded harness app tier to the
  # AliothStudio catalog React line (mirrors the harness Alioth branch).
  react: '^19.2.8'
  react-dom: '^19.2.8'
  '@types/react': '^19.2.17'
  # Security floors raised 2026-09-13 from `pnpm audit --audit-level=moderate`
  # (12 high / 6 moderate). Each stays within the range's own major line so
  # consumers keep their expected API.
  fast-uri: '^3.1.8'
  js-yaml: '^4.3.2'
  hono: '^4.13.5'
  qs: '^6.16.0'
  adm-zip: '^0.6.1'
  # The nested 11.7.0 copy carried four advisories fixed in 11.11; the
  # workspace itself pins pnpm 12.6.0 via packageManager.
  pnpm: '12.6.0'
  sharp: '>=0.35.5'
  yaml: '>=2.8.3'
  # Security floors raised 2026-09-30 from `pnpm audit --audit-level=moderate`
  # (11 high / 18 moderate after the harness moved to the 0.2.0-rc.2 line).
  # Every offending path is reached through the harness sibling checkout —
  # `util/http-proxy` + `web/web-fetch-http` (undici), `apps/desktop`'s
  # electron-builder chain (brace-expansion via minimatch), and the
  # `@modelcontextprotocol/sdk` → `express-rate-limit` / ajv subtrees
  # (ip-address, fast-uri) — so the floor belongs to this workspace the same way
  # the pre-existing entries do. Scoped to each package's own major line: a
  # consumer that asked for undici 7 or brace-expansion 1 must not be handed a
  # different major. Each value is the lowest release that clears its advisories.
  'undici@^8': '^8.10.2'
  'undici@^7': '^7.29.1'
  'ip-address@^10': '^10.7.1'
  'brace-expansion@^1': '^1.1.21'
  'brace-expansion@^2': '^2.1.7'
  'brace-expansion@^5': '^5.0.12'
  # Security floors raised 2026-10-08 from `pnpm audit --audit-level=moderate`
  # (13 findings: 1 critical / 6 high / 3 moderate / 3 low — up from 2 findings on
  # 2026-10-04, because every one of these advisories was published after that run,
  # not because a dependency moved). Each path resolves through the harness sibling
  # checkout or a plugin tree already owned here: `express` ←
  # `@modelcontextprotocol/sdk` (proxy-addr, the critical), `apps/desktop`'s
  # electron-builder chain (http-cache-semantics), `host/webserver` (compression),
  # the vitest/vite chain (source-map-js), `tool-alioth-meta` →
  # `@huggingface/transformers` (sharp), `env-alioth` (postcss-selector-parser) and
  # the root `knip` (smol-toml). Scoped to each package's own major line; each value
  # is the lowest release that clears its advisories.
  'proxy-addr@^2': '^2.0.8'
  'compression@^1': '^1.8.2'
  'http-cache-semantics@^4': '^4.3.0'
  'source-map-js@^1': '^1.2.2'
  '@modelcontextprotocol/sdk@^1': '^1.31.0'
  '@modelcontextprotocol/client@^2': '^2.2.0'
  'postcss-selector-parser@^7': '^7.1.6'
  'smol-toml@^1': '^1.9.0'
  # The two remaining LOW advisories, below the gate's moderate floor. Both are
  # floored here after measuring what the jump actually changes:
  #   dompurify 3.4.15 → ≥3.4.16 sits inside the declaring range (`^3.4.11` in the
  #     harness `ui-sidebar-documentpreview`) — a plain in-range floor.
  #   katex 0.16.47 → ≥0.18.11 is a cross-minor jump for a `^0.16.47` declaration, so it
  #     was verified first: 0.18.11 renames the emitted internal classes
  #     (`base`→`katex-base`, `strut`→`katex-strut`) and renames them in its own shipped
  #     CSS in lockstep — the declarations behind those classes are byte-identical to
  #     0.16.47's, this workspace styles only the stable `.katex` / `.katex-display` /
  #     `.katex-error` names, and the math e2e asserts stable classes plus the aria tree,
  #     so the rename stays inside katex. `renderToString` with the two option sets the
  #     renderer uses (`throwOnError: true`, then `strict: 'ignore'` + `throwOnError:
  #     false`) behaves the same, and the client bundle builds with it.
  'dompurify@^3': '^3.4.16'
  katex: '^0.19.0'
  # fflate: `@deepseek-ai/libreoffice-kit` pins 0.8.2 exactly; the 2026-09-30 note claimed
  # the floor forced an unreachable tarball re-materialization, which no longer holds —
  # 2026-10-08 re-test resolved 0.8.3 cleanly on the npmjs registry this repo pins.
  'fflate@^0.8': '^0.8.3'
  # uuid: the only dependent is `@fortune-sheet/core` (`^8.3.2`), which imports `v4`
  # (a named export that survives every uuid line) and never calls the v3/v5/v6 `buf`
  # path the advisory covers. 8 → 14 is ESM-only; the client bundle resolves the
  # dependent's `.esm.js` entry, which imports `v4` from the package root and loads clean.
  uuid: '^14.0.2'
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  electron-winstaller: false
  esbuild: true
  fs-ext: true
  koffi: true
  lefthook: true
  msgpackr-extract: false
  node-pty: true
  onnxruntime-node: true
  # Nested CLI copy forced by the pnpm override above.
  pnpm: true
  protobufjs: true
  sharp: true

