# Composite action: check out the harness source tree the workspace
# devDependencies resolve to, and (by default) build its host libs.
#
# Call it after the job has checked this repository out — a local action only
# exists once its repository is in the workspace:
#   - uses: actions/checkout@v4
#     with: { path: dsh-alioth }
#   - uses: ./dsh-alioth/.github/actions/harness-boot      # build: 'true'
#
# The harness checkout is the Alioth development line
# (William-d-zk/deepseek-harness@Alioth), pinned to a commit so CI verifies a
# reproducible revision. The public fork is required because the line carries
# commits that are not in deepseek-ai/deepseek-harness yet (connection account
# context, page-feedback). The ref must equal **the local checkout AND the revision
# this repo's lockfile was last generated against**: the consumer lockfile carries an
# importer section for every harness workspace member, so a ref that differs in any
# member's specifier fails every job at `install (frozen)` with "specifiers in the
# lockfile don't match specifiers in package.json" — a harness-side manifest edit
# (e.g. page-feedback's `workspace:^` vs `workspace:~`) is enough to do it. Advance
# both in one change:
#   git -C ../deepseek-harness rev-parse HEAD   # then pin it here
#   cd .. && pnpm install --lockfile-only      # and regenerate with that tree checked out
name: harness boot
description: Check out the pinned harness line as a sibling checkout and build its host libs.

inputs:
  build:
    description: Build the harness host libs (set 'false' when the consumer builds them itself, e.g. in the image).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        # Sibling of the `dsh-alioth` checkout inside the workspace: the
        # consumer's pnpm workspace resolves the harness via `../deepseek-harness/*`
        # globs, so it must NOT live at dsh-alioth/deepseek-harness. Verified
        # locally in this exact layout: `pnpm install --frozen-lockfile` passes.
        repository: William-d-zk/deepseek-harness
        # The leading baseline of the Alioth line: the rc.2 upstream merge
        # (`dsh-v0.1.7-rc.2`), its two typecheck follow-ups, and the client
        # re-layering that made `verify-client-domain-graph` clean repo-wide
        # (`workspace/workspace` also gained the optional `dsh-session-projection-cache`
        # dependency the session-delete path needs). Plus the browser-local
        # Ungrouped bucket suppression (`25e679fdd4`, client source only — no
        # manifest change, so the lockfile stays).
        # 2026-09-30: advanced across the 0.2.0-rc.2 upstream merge — the whole
        # workspace bumped 0.1.7-rc.2 → 0.2.0-rc.2, so the consumer's declared
        # ranges moved to `^0.2.0-rc.2` and every harness importer section in
        # `pnpm-lock.yaml` was regenerated. Pin and lockfile MUST move
        # together — regenerate `pnpm-lock.yaml` against this revision in the
        # same commit, or the frozen install fails.
        # 2026-10-08: advanced to the harness Alioth HEAD across the three
        # post-merge chores (Claude Code instruction symlinks removed, stale
        # `src/invariant.ts` README rows dropped, runtime API catalog
        # regenerated) — no `package.json` / `pnpm-lock.yaml` delta, so the
        # lockfile stays as generated for `02a0004b4b` and the ref tracks the
        # local checkout again.
        ref: 86806b28df5e5f4ab7b6b109db4f0912dd3a1cbe
        path: deepseek-harness
    - uses: actions/setup-node@v4
      if: inputs.build == 'true'
      with:
        node-version: 24
    - name: enable pnpm
      if: inputs.build == 'true'
      shell: bash
      run: corepack enable && corepack prepare pnpm@12.6.0 --activate
    - name: harness install + host build
      if: inputs.build == 'true'
      shell: bash
      working-directory: deepseek-harness
      # Not frozen: the harness workspace lists out-of-root members that exist
      # only on a development machine (../dsh-chess, ../../.dsh-chess/profiles);
      # its lockfile carries importers for them, so a frozen check cannot pass
      # without those checkouts. The consumer's own install stays frozen.
      run: pnpm install --no-frozen-lockfile && pnpm run build:lib:host && pnpm run build:lib:client
