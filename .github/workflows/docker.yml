# Docker delivery gate: build the image and run the keyless self-check
# (composition smoke + doctor inside the container). Slow job — isolated from
# ci.yml so the gate matrix stays fast. The build context is the parent of
# both checkouts: the Dockerfile consumes `dsh-alioth/` plus the harness
# source tree (`deepseek-harness/`, tag dsh-v0.1.3-alpha.1) that the
# workspace devDependencies resolve to.
name: docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: docker build + keyless --check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-alioth
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.3-alpha.1
          path: deepseek-harness
      - name: build image
        run: docker build -f dsh-alioth/Dockerfile -t dsh-alioth:ci .
      - name: keyless self-check (composition smoke + doctor, no API key)
        run: docker run --rm --entrypoint /app/scripts/docker-check.sh dsh-alioth:ci
