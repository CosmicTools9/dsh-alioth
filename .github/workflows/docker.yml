# Docker delivery gate: build the image and run the keyless self-check
# (composition smoke + doctor inside the container). Slow job — isolated from
# ci.yml so the gate matrix stays fast. The build context is the parent of
# both checkouts: the Dockerfile consumes `dsh-alioth/` plus the harness
# source tree (`deepseek-harness/`, pinned by the harness-boot action) that
# the workspace devDependencies resolve to.
name: docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: docker build + keyless --check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-alioth
      # The harness checkout (and its pin) lives in the harness-boot action;
      # the image builds it, so only the sources are needed here.
      - uses: ./dsh-alioth/.github/actions/harness-boot
        with:
          build: 'false'
      - name: build context ignores
        # The context is the workspace root, which holds both git checkouts.
        # Keep their .git/node_modules out of the sent context.
        run: |
          printf '%s\n' '**/.git' '**/node_modules' '**/coverage' > .dockerignore
      - name: build image
        # Context is the workspace root: it holds dsh-alioth/ and the sibling
        # deepseek-harness/, which is exactly what the Dockerfile consumes.
        # GIT_COMMIT: the build context excludes .git, so the harness's client build record would
        # otherwise carry no commit (its helper reads `git rev-parse HEAD`).
        run: docker build --build-arg GIT_COMMIT="$(git -C dsh-alioth rev-parse HEAD)" -f dsh-alioth/Dockerfile -t dsh-alioth:ci .
      # `--check` goes through the entry script, which starts PostgreSQL 18 on
      # /data and exports ALIOTH_DATABASE_URL before running docker-check.sh.
      - name: keyless self-check (composition smoke + doctor, no API key)
        run: docker run --rm dsh-alioth:ci --check
