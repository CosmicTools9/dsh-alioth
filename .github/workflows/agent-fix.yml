# L2 agent auto-repair: when the `ci` gate matrix fails on a same-repo PR,
# run L0 (lint:fix) deterministically, then hand the residual semantic
# failures (typecheck / tests / gate scripts) to the dsh headless agent,
# verify locally, and push the fix back to the PR branch.
#
# Requires repo secret DEEPSEEK_API_KEY; without it the job no-ops.
# Loop cap: at most 3 [agent-fix] commits per branch, then it stops.
name: agent-fix

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write # push fix commits to the PR branch
  pull-requests: write # outcome comments
  actions: read # read failed-run logs

concurrency:
  group: agent-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  fix:
    name: L2 agent repair (dsh headless)
    # Same-repo PRs only: never check out fork code next to secrets.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate

      - name: guard — secret present and attempt cap not reached
        id: guard
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY secret not set; agent-fix disabled" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          attempts=$(git log HEAD --grep='\[agent-fix\]' --format=%H | wc -l | tr -d ' ')
          if [ "$attempts" -ge 3 ]; then
            echo "attempt cap reached ($attempts)" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: install (frozen)
        if: steps.guard.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: L0 — deterministic lint auto-fix
        if: steps.guard.outputs.ok == 'true'
        run: pnpm run lint:fix || true

      - name: collect failed logs
        if: steps.guard.outputs.ok == 'true'
        run: gh run view "$RUN_ID" --log-failed > /tmp/failed.log 2>/dev/null || gh run view "$RUN_ID" --log > /tmp/failed.log
        env:
          GH_TOKEN: ${{ github.token }}

      - name: build agent prompt
        if: steps.guard.outputs.ok == 'true'
        run: |
          {
            echo "CI gate matrix failed on this branch. Fix the residual failures below."
            echo ""
            echo "Rules:"
            echo "- L0 already ran (pnpm run lint:fix). Do NOT re-format unrelated files."
            echo "- Minimal diffs only; fix the reported failures, nothing else."
            echo "- NEVER touch .github/workflows, lefthook.yml, package.json scripts, or gate scripts under scripts/check-* to make failures go away — fix the source, not the gate."
            echo "- Do NOT commit; the workflow commits after verifying gates."
            echo "- When done, ensure: pnpm run typecheck && pnpm run lint && pnpm run test all pass."
            echo ""
            echo "Failed CI log (tail):"
            echo '```'
            tail -c 40000 /tmp/failed.log
            echo '```'
          } > /tmp/prompt.md

      - name: L2 — dsh headless agent repair
        if: steps.guard.outputs.ok == 'true'
        run: pnpm exec dsh --profile headless "$(cat /tmp/prompt.md)"

      - name: verify quick gates
        if: steps.guard.outputs.ok == 'true'
        id: verify
        run: |
          pnpm run typecheck && pnpm run lint && pnpm run test \
            && pnpm run check:strip-only && pnpm run check:vendor \
            && pnpm run check:versions && pnpm run check:tree-assembly

      - name: push fix to PR branch
        if: steps.guard.outputs.ok == 'true' && steps.verify.outcome == 'success'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "agent produced no changes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "dsh-alioth-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "[agent-fix] fix: address CI gate failures (run $RUN_ID)"
          git push origin "HEAD:$BRANCH"

      - name: report on PR
        if: steps.guard.outputs.ok == 'true' && always()
        run: |
          pr=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          [ -z "$pr" ] && exit 0
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            gh pr comment "$pr" --body "[agent-fix] pushed a repair commit for run $RUN_ID; CI re-running."
          else
            gh pr comment "$pr" --body "[agent-fix] attempted repair for run $RUN_ID but quick gates still fail; leaving the branch untouched."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
