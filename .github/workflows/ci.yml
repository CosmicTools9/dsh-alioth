# Full gate matrix. Local equivalents: see package.json scripts + AGENTS.md.
# Every job is a gate — no continue-on-error. Docker build+check lives in
# docker.yml (heavier image job).
#
# Harness sourcing (2026-09-04): @deepseek-ai devDependencies pin
# 0.1.3-alpha.1, which exists only in the deepseek-harness source tree (tag
# dsh-v0.1.3-alpha.1). Jobs that install this workspace first clone the
# harness as a sibling and build its host libs; the workspace glob
# ../deepseek-harness/* resolves devDeps to that checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checkout both repos + toolchain + harness host build. Every install job
# starts from this anchor; step defaults run inside dsh-alioth/.
x-harness-boot: &harness-boot
  - uses: actions/checkout@v4
    with:
      path: dsh-alioth
  - uses: actions/checkout@v4
    with:
      repository: deepseek-ai/deepseek-harness
      ref: dsh-v0.1.3-alpha.1
      path: deepseek-harness
  - uses: actions/setup-node@v4
    with:
      node-version: 24
  - name: enable pnpm
    run: corepack enable && corepack prepare pnpm@11.24.0 --activate
  - name: harness install (frozen) + host build
    working-directory: deepseek-harness
    run: pnpm install --frozen-lockfile && pnpm run build:lib:host

jobs:
  gates:
    name: gates (typecheck lint test coverage knip checks smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-alioth
    steps:
      - *harness-boot
      # bun is a declared deployment dependency (prototype gates run on it);
      # the skill-alioth probe asserts availability on the toolchain.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: install (frozen)
        run: pnpm install --frozen-lockfile
      - name: typecheck (packages + scripts + tests)
        run: pnpm run typecheck
      - name: lint
        run: pnpm run lint
      - name: test + coverage thresholds
        run: pnpm run test:coverage
      - name: knip (unused deps/exports/files)
        run: pnpm exec knip
      - name: strip-only compatibility
        run: pnpm run check:strip-only
      - name: vendor provenance
        run: pnpm run check:vendor
      - name: version + license sync
        run: pnpm run check:versions
      - name: composition tree assembly
        run: pnpm run check:tree-assembly
      - name: composition smoke (real Context, builtin model, zero network)
        run: node --import tsx scripts/smoke-composition.ts

  dicts-freshness:
    name: semantic dicts fresh vs model repo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-alioth
    steps:
      - *harness-boot
      - name: install (frozen)
        run: pnpm install --frozen-lockfile
      - name: clone the Alioth model repo
        run: git clone --depth 1 https://github.com/CosmicTools9/Alioth "${{ github.workspace }}/Alioth"
      - name: anchored + fresh
        run: pnpm run check:dicts
        env:
          ALIOTH_REPO: ${{ github.workspace }}/Alioth

  commitlint:
    name: conventional commits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-alioth
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-alioth
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.3-alpha.1
          path: deepseek-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - name: harness install (frozen) + host build
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile && pnpm run build:lib:host
      - name: install (frozen)
        run: pnpm install --frozen-lockfile
      - name: lint commit range
        run: |
          RANGE="origin/${{ github.base_ref || 'main' }}..HEAD"
          if git rev-parse --verify "$RANGE" >/dev/null 2>&1 && [ "$(git rev-list --count $RANGE)" -gt 0 ]; then
            pnpm exec commitlint --from "origin/${{ github.base_ref || 'main' }}" --to HEAD
          else
            echo "no commits in range; validating HEAD"
            git log -1 --pretty=%s | pnpm exec commitlint
          fi

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-alioth
    steps:
      - *harness-boot
      - name: install (frozen)
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (moderate floor, overrides in pnpm-workspace.yaml)
        run: pnpm audit --audit-level=moderate

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action v2 requires an org license; run the binary directly
      # (license-free) so secret scanning stays on for every push.
      - name: gitleaks
        env:
          GITLEAKS_ENABLE_UNADVISED_MODE: "true"
        run: |
          set -x
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code
