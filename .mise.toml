# dsh-alioth 启动命令
# launch：启动 web 界面（浏览器 GUI）并自动拉起浏览器（需 DEEPSEEK_API_KEY；DSH_WEB_PORT 可改端口，默认 3100）
# dev：headless 一次性会话，创建企业应用（需 DEEPSEEK_API_KEY）
# alioth:doctor：环境自检——拉取/校验模型快照、连接环境里的 PostgreSQL 18（ALIOTH_DATABASE_URL，必需）、引导 isahl_meta、输出健康报告（退出码 0 = 绿；env 覆盖 ALIOTH_MODEL_SOURCE / ALIOTH_DATABASE_URL / ALIOTH_DATA_ROOT）
# 可选 ALIOTH_PRE_PROC_ROOT（默认 $HOME/.dsh-alioth/Pre-Proc）

#
# 工具链钉住，与 harness 线对齐（34b6d00 起 node 26.10.0；Docker 侧仍 node:24.20-slim，engines 两者都容）:
#   node 26.10.0 — 对齐 deepseek-harness 线（>=24 均可，dev 用 26.10.0）。
#   pnpm 12.8.1 — 镜像钉，与 package.json#packageManager 同值同升。corepack 通道已死：
#   node 26 起不再随装 corepack（lib/node_modules 只有 npm），mise 2026.11 起也改为
#   「工具供给」模型直接拒跑未钉的 pnpm——pnpm 必须进 mise，防漂移靠两处钉值同步。
# bun 不进 mise：它是各环境各自的部署依赖（mac 宿主走 brew，Docker 走
#   `npm i -g bun@1.4.2`），钉在这里会迫使每次换机的 mise install/exec 慢速拉取
#   GitHub release（本机实测 >5min 未完成）。版本真理源在 Dockerfile（1.4.2）。

[tools]
node = "26.10.0"
"npm:pnpm" = "12.8.1"  # 必须 npm 后端：裸 pnpm= 走 aqua→github release，本机被节流必超时
[tasks]
launch = "bash scripts/launch-web.sh"
"alioth:doctor" = "pnpm exec tsx scripts/alioth-doctor.ts"
"alioth:rebuild-semantic" = "pnpm exec tsx scripts/rebuild-semantic.ts"
"alioth:model-source" = "pnpm exec tsx scripts/assemble-model-source.ts"
"alioth:network-tests" = "DSH_ALIOTH_NETWORK_TESTS=1 pnpm run test"
gates = "pnpm run check:harness-paths && pnpm run typecheck && pnpm run lint && pnpm run test && pnpm run check:strip-only && pnpm run check:vendor && pnpm run check:versions && pnpm run check:dicts && pnpm run check:tree-assembly"
dev = "pnpm exec dsh --profile headless --patch examples/alioth-agent/cordis.yml \"${@:-请描述你要创建的企业应用，我会基于 Alioth 模型生成 AppCreator 产物}\""
