# dsh-alioth 启动命令
# launch：启动 web 界面（浏览器 GUI）并自动拉起浏览器（需 DEEPSEEK_API_KEY；DSH_WEB_PORT 可改端口，默认 3100）
# dev：headless 一次性会话，创建企业应用（需 DEEPSEEK_API_KEY）
# alioth:doctor：环境自检——拉取/校验模型快照、自动装配内嵌 PostgreSQL、引导 isahl_meta、输出健康报告（退出码 0 = 绿；env 覆盖 ALIOTH_MODEL_SOURCE / ALIOTH_DATABASE_URL / ALIOTH_DATA_ROOT）
# 可选 ALIOTH_PRE_PROC_ROOT（默认 ~/WorkSpace/AliothStudio/Pre-Proc）

#
# 工具链钉住，与交付环境对齐（避免迁移/对齐成本）:
#   node 24.19.0 — 对齐 Docker `node:24.19-slim` 与 AliothStudio 栈（覆盖全局 mise 的 24.16.0）。
# pnpm 不进 mise：由 corepack 按 package.json 的 packageManager 字段单源解析（11.22.0，
#   装第二份 pnpm 只会制造版本漂移。
# bun 同样不进 mise：它是各环境各自的部署依赖（mac 宿主走 brew，Docker 走
#   `npm i -g bun@1.3.14`），钉在这里会迫使每次换机的 mise install/exec 慢速拉取
#   GitHub release（本机实测 >5min 未完成）。版本真理源在 Dockerfile。

[tools]
node = "24.19.0"
[tasks]
launch = "bash scripts/launch-web.sh"
"alioth:doctor" = "pnpm exec tsx scripts/alioth-doctor.ts"
"alioth:rebuild-semantic" = "pnpm exec tsx scripts/rebuild-semantic.ts"
"alioth:network-tests" = "DSH_ALIOTH_NETWORK_TESTS=1 pnpm run test"
gates = "pnpm run typecheck && pnpm run lint && pnpm run test && pnpm run check:strip-only && pnpm run check:vendor && pnpm run check:versions && pnpm run check:dicts && pnpm run check:tree-assembly"
dev = "pnpm exec dsh --profile headless --patch examples/alioth-agent/cordis.yml \"${@:-请描述你要创建的企业应用，我会基于 Alioth 模型生成 AppCreator 产物}\""
