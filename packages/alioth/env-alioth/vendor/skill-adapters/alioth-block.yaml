name: alioth-block
description: "Block Capability 原型设计与前端实现 — 提取 → 原型 → 实现"
version: "2.5"
default_tools: [todo]
reference_paths:
  - ".agents/skills/alioth-design/references/gateway-shell.tsx"
  - ".agents/skills/alioth-design/references/prototype-base.css"
  - ".agents/skills/alioth-design/references/shells/block-shell.tsx"
  - ".agents/skills/alioth-design/references/agent-build-discipline.md"
  - "docs/specs/BLOCK_SCHEMA.md"
tracks:
  - name: Block 原型
    steps:
      - id: "1.1"
        instruction: "Track 0 — Block 骨架确认：block.json 已由 BlockCreation 脚手架创建（Pre-Proc/{ns}/Sources/Apps/Blocks/{block}/block.json，含扁平顶层字段 id/namespace/name/version/services/prototypeVersion/sharing/block/coordinates，符合 BLOCK_SCHEMA 规范），门禁将按 check-config-json.mjs 校验（block required = id/namespace/name/version 字符串 + services 数组）。禁止把 block.json 重构为 schema/metadata 嵌套格式（实测 LLM 自造 {schema, metadata:{ns}} 结构导致 5 次门禁失败）；禁止整体重写 block.json 丢字段（实测 5 次重试不收敛）。仅当 read_file 确认顶层缺必填字段时补写——优先 patch_file 增量补字段（保留全部既有字段），全量重写仅作兜底。其余骨架文件无需创建。实现前 MUST 先判块粒度与视图轴（四条判据见 .agents/skills/alioth-block/SKILL.md §判断准则 + docs/specs/BLOCK_SCHEMA.md §7：块=业务域×操作闭环，MUST NOT 单页/单视图建块；视图轴 MUST 为筛选 pill（≤5）/filter-bar，MUST NOT 路由化；合并块 coordinates 原样继承主视图成员、services/flows 取并集；app.json#config.blocks 只声明独立块）。"
        tools: [read_file, write_file, search_files, code_intel, patch_file, file_diff]
        schema: {type: object, required: [module_id, block_ids]}
        gates:
          - program: "bun"
            args: ["scripts/check/check-config-json.mjs", "block", "Pre-Proc/{ns}/Sources/Apps/Blocks/{block}/block.json"]
            timeout_sec: 30
          # 严格形状门禁：组合键（module/moduleId/order/group/entry/routePrefix）与未知键一律拒绝
          # —— 组合关系 MUST 由 module.json#blockAssembly.blocks[] 声明（BLOCK_SCHEMA §1.1 + block-schema capability）
          - program: "bun"
            args: ["scripts/check/check-block-json.ts", "--only", "Pre-Proc/{ns}/Sources/Apps/Blocks/{block}/block.json"]
            timeout_sec: 30
          # 能力清单一致性：services[] / sharing.ownerModule / sharing.consumers[] MUST 命中清单
          - program: "bun"
            args: ["scripts/capability-catalog.ts", "{ns}", "--check", "Pre-Proc/{ns}/Sources/Apps/Blocks/{block}/block.json"]
            timeout_sec: 60
      - id: "1.2"
        instruction: Track 1 — Block 原型业务内容填充（Step 1-19）— 在 Pre-Proc/{ns}/Prototypes/Blocks/{block}/llm-tsx/block.tsx 写入业务内容实现（可基于骨架扩展，保持 displayName 与零 props 契约）
        tools: [read_file, write_file, lint_file]
        schema: {type: object, required: [block_prototypes]}
        gates:
          - output_glob: "Pre-Proc/{ns}/Prototypes/Blocks/{block}/llm-tsx/block.tsx"
      - id: "1.3"
        instruction: 构建 + 验证 — prototype-tool.js build → prototype-check。同时 MUST 登记未覆盖项：uncovered 数组逐条写「未覆盖范围 + 手工动作」（如某状态未实现、某 Service 未接线）；全部覆盖时输出空数组并在 summary 中写「无未覆盖项」——禁止以省略表达部分完成。
        tools: [read_file, run_command]
        schema: {type: object, required: [build_output, uncovered]}
        gates:
          - program: "bun"
            args: ["scripts/prototype-tool.js", "build", "Pre-Proc/{ns}/Prototypes/Blocks/{block}/llm-tsx/block.tsx"]
            output_glob: "Pre-Proc/{ns}/Prototypes/Blocks/{block}/b-v*.html"
            timeout_sec: 180
          - program: "target/debug/ontology-mapping"
            args: ["prototype-check", "Pre-Proc/{ns}/Prototypes/Blocks/{block}"]
            timeout_sec: 240
          - program: "bun"
            args: ["scripts/check/check-prototype-types.ts", "--fail"]
            timeout_sec: 120
          - program: "bun"
            args: ["scripts/check/check-prototype-render.ts", "--changed", "--fail"]
            timeout_sec: 300
