name: alioth-compose
description: "应用组装 — app.json(全字段对齐 app.schema.json) + extensions/*.yaml + ESM 原型构建与校验"
version: "2.0"
tracks:
  - name: 应用组装验证
    steps:
      - id: "1.1"
        instruction: preflight — 确认 compose 产物目录已生成 app.json
        tools: [read_file]
        schema: {type: object, required: [app_name]}
        gates:
          - output_glob: "Pre-Proc/{ns}/Apps/{app}/app.json"
      - id: "1.2"
        instruction: 确认 app.json 存在且可解析；全字段 schema 校验（required/pattern/enum/format/未知键）由 AppAgent evaluate assess_schema_validity 在 Verifying 阶段执行（自动链内门禁）
        tools: [read_file]
        schema: {type: object, required: [app_json_valid]}
        gates:
          - output_glob: "Pre-Proc/{ns}/Apps/{app}/app.json"
      - id: "1.3"
        instruction: 校验 extensions/*.yaml 格式有效（constraints/rules/statemachines/workflows）
        tools: [read_file]
        schema: {type: object, required: [extensions_valid]}
        gates:
          - output_glob: "Pre-Proc/{ns}/Apps/{app}/extensions/*.yaml"
      - id: "1.4"
        instruction: 构建 ESM 原型（prototype-tool.js build → a-v{N}.html）
        tools: [read_file, run_command]
        schema: {type: object, required: [prototype_path]}
        gates:
          - program: "bun"
            args: ["scripts/prototype-tool.js", "build", "Pre-Proc/{ns}/Prototypes/Apps/{app}/llm-tsx/app.tsx"]
            output_glob: "Pre-Proc/{ns}/Prototypes/Apps/{app}/a-v*.html"
            timeout_sec: 180
      - id: "1.5"
        instruction: "组装完整性确认 — compose-report.json 已由 Composing 状态代码确定性生成（纯派生数据，禁止手写/重写）；用 read_file 确认其存在且 app/modules/extensions 字段与实际产物一致，然后输出 completed: true"
        tools: [read_file]
        schema: {type: object, required: [compose_report]}
        gates:
          - output_glob: "Pre-Proc/{ns}/Apps/{app}/compose-report.json"
          - program: "bun"
            args: ["scripts/check/check-nav-hrefs.ts", "--fail", "--ns", "{ns}"]
            timeout_sec: 120
source:
  content_sha256: 632a971f42d4873c063994388f938b97975aacba43e88a4aaf0432680b14c977
