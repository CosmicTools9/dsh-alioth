name: alioth-gui
description: "前端业务代码开发 — 类型 → API hooks → 页面组件 → 路由 → 视觉验证"
version: "2.0"
tracks:
  - name: 前端开发
    steps:
      - id: "1.1"
        instruction: Track 0 — 模块分析，读取 module.json/block.json → 数据模型文档
        tools: [read_file, write_file]
        schema: { type: object, required: [data_model_doc] }
        gates:
          - output_glob: "Pre-Proc/{ns}/Sources/Modules/{module}/module.json"
      - id: "1.2"
        instruction: Track 1 — 类型定义 + API hooks + mapper 函数
        tools: [read_file, write_file, search_file]
        schema: { type: object, required: [types_api_hooks] }
        gates:
          - output_glob: "Pre-Proc/{ns}/Sources/Modules/{module}/frontend/src/types/*.ts"
      - id: "1.3"
        instruction: Track 2 — 页面组件：列表页 → 表单页 → 详情页 → 通用组件
        tools: [read_file, write_file, search_file]
        schema: { type: object, required: [page_components] }
        gates:
          - output_glob: "Pre-Proc/{ns}/Sources/Modules/{module}/frontend/src/pages/*.tsx"
      - id: "1.4"
        instruction: Track 3 — 路由集成：App.tsx + ModuleLayout + i18n + theme.css
        tools: [read_file, write_file]
        schema: { type: object, required: [routing_integration] }
        gates:
          - program: "npx"
            args: ["tsc", "--noEmit"]
            timeout_sec: 180
      - id: "1.5"
        instruction: Track 4 — 原型代码对齐：差距分析 → Block 修正 → 视觉验证
        tools: [read_file, write_file]
        schema: { type: object, required: [alignment_report] }
        gates:
          - output_glob: "Pre-Proc/{ns}/Prototypes/visual-verify/{module}/v*/report.json"
