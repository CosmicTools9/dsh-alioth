# alioth-service-demand — 组合薄壳
#
# 实现单源 = Framework `demand` 内核（模型数据链路基础设施；合规定位见
# openspec/specs/framework-scope-boundary R1 ② 类 + R2「ns 后端 MUST 为组合薄壳」）。
# 单源判定：change extract-ns-service-kernels-demand-openapi
# （原 Alioth 与 Cosmic-Tools 各持一份逐字相同实现；本壳只保留 crate 名/lib 名与路由注册）。
[package]
name = "alioth-service-demand"
version = "0.1.0"
edition = "2021"

[lib]
name = "alioth_service_demand"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
actix-web = { workspace = true }
demand = { path = "../../../../../../../Framework/backend/demand" }
