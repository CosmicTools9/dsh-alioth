[package]
name = "alioth-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"] }
actix-web = "4.13"
actix-multipart = "0.8"
awc = "3"
tokio = { workspace = true, features = ["full"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "uuid", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
walkdir = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
dotenvy = { workspace = true }

# Cryptography
argon2 = { workspace = true }
aes-gcm = { workspace = true }
base32 = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

# 附件文档解析（chat 附件：pdf / xlsx / docx）
pdf-extract = { workspace = true }
lopdf = { workspace = true }
calamine = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }

# TOTP and QR code
totp-rs = { workspace = true }

# WebSocket
actix-web-actors = { workspace = true }
actix = { workspace = true }
dashmap = { workspace = true }

# JWT
jsonwebtoken = { workspace = true }
p256 = { workspace = true, features = ["pkcs8"] }

# CORS 支持
actix-cors = { workspace = true }

# OAuth2/OIDC
reqwest = { workspace = true, features = ["json", "stream"] }
urlencoding = { workspace = true }

# NGAC contract (解耦 Gateway ↔ SSO 编译依赖)
ngac-contract = { path = "../../Framework/backend/ngac-contract" }

# JSONC 解析（JSON5 支持）
json5 = { workspace = true }

# Token 计数
tiktoken-rs = "0.12"

# JSON Schema 生成
schemars = "1.2"

# Prometheus metrics
prometheus = { workspace = true }

# LDAP
ldap3 = { version = "0.12", features = ["tls-native"] }

mime_guess = "2"

# 安全相关
zeroize = "1"
secrecy = "0.10"

rust_decimal = { workspace = true }

# Framework modules (local paths)
common = { path = "../../Framework/backend/common" }
audit-writer = { path = "../../Framework/backend/audit-writer" }
# NGAC 主体/组织/身份共享内核（岗位任职桥写归口，M226/ADR A-3）
identity-org = { path = "../../Framework/backend/identity-org" }
outbound-client = { path = "../../Framework/backend/outbound-client" }
i18n = { path = "../../Framework/backend/i18n" }
llm = { path = "../../Framework/backend/llm" }
doc-recognition = { path = "../../Framework/backend/doc-recognition" }
ai-agent = { path = "../../Framework/backend/ai-agent" }
version = { path = "../../Framework/backend/version" }
quality = { path = "../../Framework/backend/quality" }
encoding = { path = "../../Framework/backend/encoding" }
system-config = { path = "../../Framework/backend/system-config" }
crud = { path = "../../Framework/backend/crud" }
runtime-engine = { path = "../../Framework/backend/runtime-engine" }
trigger-registry = { path = "../../Framework/backend/trigger-registry" }
framework-schedule = { path = "../../Framework/backend/schedule" }
framework-inbox = { path = "../../Framework/backend/inbox" }
framework-contacts = { path = "../../Framework/backend/contacts" }
framework-presence = { path = "../../Framework/backend/presence" }
framework-workspace-approval = { path = "../../Framework/backend/workspace-approval" }
framework-file-manager = { path = "../../Framework/backend/file-manager", features = ["s3"] }
approval = { path = "../../Framework/backend/approval" }
ontology-binding = { path = "../../Framework/backend/ontology-binding" }
framework-scheduler = { path = "../../Framework/backend/scheduler" }
gateway-sso = { path = "../../SSO/backend", optional = true }

# Cosmic-Tools factors
# SE factors
# AVIC-CAASEC factors
# Cosmic-Tools bv-local（上门服务订单管理：服务项目/服务人员/预约/服务订单/微信支付结算）

# 代码智能域：仓库分支/版本标签的 CRUD 数据面（zc_id_cate-ver_branch / zc_id_cons-date-tags）
wechat-pay-adapter = { path = "../../Ext-adapter/wechat-pay/backend", optional = true }

[dev-dependencies]
actix-rt = { workspace = true }
tempfile = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "chrono", "uuid", "json", "macros"] }

[features]
# preproc-proxy：Pre-Proc 未认证透明反代（/preproc/*、/api/pre_proc/*）——dev 形态默认开启；
# 生产构建（scripts/build-ns.sh --no-default-features）不含 → 生产二进制无此路由（404）。
# Cosmic-Tools：复用 Alioth 通用 service 组（inventory/demand/approval 等）+ 自有 ct-git service
# SE namespace（研发预算管理）：5 个服务 crate（build.rs 按 service.json 自动注册路由）

# Individual factor crate features

# SE factor features
# AVIC-CAASEC factor features
sso = ["gateway-sso"]
# E2E 测试专用：启用 PEP 的 E2E_TEST_MODE 认证绕过分支（仅测试环境构建）。
# 生产/常规 release 构建不启用此 feature → 认证绕过代码不被编译。
e2e-test-mode = []
# 远程 SSO 模式：Gateway 不内嵌 SSO 路由，仅通过远程 PDP(SSO_SERVICE_URL) 与
# JWT 公钥校验(SSO_JWT_PUBLIC_KEY/ISSUER) 委托给独立部署的 SSO 服务。
# 与 `sso` 互斥——两者不能同时开启（见 main.rs 顶部 compile_error 守卫）。
sso-remote = []
# Pre-Proc 未认证透明反代（/preproc/* 与 /api/pre_proc/*）——仅 dev 形态启用：
# 加入 default features 保持 dev 行为；生产构建（build-ns.sh --no-default-features）
# 与 no-sso 形态不启用 → 路由完全不注册（404）。见 openspec change fix-gateway-proxy-standalone-auth。
preproc-proxy = []
