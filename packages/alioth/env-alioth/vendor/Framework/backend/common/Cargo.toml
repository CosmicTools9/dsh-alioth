[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
actix-web = { workspace = true }
actix-cors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
jsonwebtoken = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
rust_decimal = { workspace = true }
# SMTP 的 TLS 后端 = native-tls（macOS Security.framework / Linux OpenSSL）。
# 为何不用 rustls（lettre 默认推荐）：lettre 0.11 `transport/smtp/client/tls.rs:328` 以
# `#[cfg(all(not(feature = "rustls"), feature = "native-tls"))]` 守卫选择实现 ⇒ rustls 在场时会盖过
# native-tls，二者不能并存。实测（2026-09-24）：rustls 路径对 smtp.exmail.qq.com:587 STARTTLS
# 报 `peer closed connection without sending TLS close_notify` 且**邮件未投递**，而同参数 curl
# （OpenSSL 系）可投递 ⇒ 差异只在 TLS 实现栈。详见 openspec/changes/fix-email-smtp-tls-backend。
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder", "pool"] }
reqwest = { workspace = true }
hmac = "0.13"
sha1 = "0.11"
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
percent-encoding = "2"
uuid = { workspace = true }
# 生产依赖：`src/plan_execution.rs`（record_plan_execution/record_slice_flip，被 schedule/scheduler 调用）
# 直接使用 `ontology_binding::resolve` 解析坐标三元组——此前误置于 [dev-dependencies]，导致
# 任何以普通依赖方式编译 common 的场景（如 `cargo check -p <service>`）报 E0433。
ontology-binding = { path = "../ontology-binding" }

[lib]

[dev-dependencies]
tokio = { workspace = true }
actix-rt = { workspace = true }
