[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
actix-web = { workspace = true }
actix-cors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
jsonwebtoken = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
rust_decimal = { workspace = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "pool"] }
reqwest = { workspace = true }
hmac = "0.13"
sha1 = "0.11"
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
percent-encoding = "2"
uuid = { workspace = true }
# 生产依赖：`src/plan_execution.rs`（record_plan_execution/record_slice_flip，被 schedule/scheduler 调用）
# 直接使用 `ontology_binding::resolve` 解析坐标三元组——此前误置于 [dev-dependencies]，导致
# 任何以普通依赖方式编译 common 的场景（如 `cargo check -p <service>`）报 E0433。
ontology-binding = { path = "../ontology-binding" }

[lib]

[dev-dependencies]
tokio = { workspace = true }
actix-rt = { workspace = true }
