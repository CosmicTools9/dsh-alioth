<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Alioth AppCreator">
  <!-- Alioth AppCreator mark: a geometric "A" (Alioth), monochrome on a
       transparent tile — the same convention as the DeepSeek Harness favicon
       pair (light/dark variants selected by prefers-color-scheme). Chosen over
       the ubiquitous AI-sparkle: a letter survives a 16px tab and names *this*
       product instead of a genre.

       Two contours, evenodd: the outer one carves the gap between the legs, the
       inner one is the counter. Leg thickness is 3.4 horizontal = 3.19
       perpendicular, matched by the 3.2 crossbar so the optical weight is even;
       flat apex and mitred joints keep it crisp when rasterized to 16px. -->
  <path fill-rule="evenodd" fill="#0f1115"
        d="M14.2 6.5 H17.8 L24.8 25.5 H21.4 L19.853 21.3 H12.147 L10.6 25.5 H7.2 Z
           M16 10.839 L18.674 18.1 H13.326 Z"/>
</svg>
