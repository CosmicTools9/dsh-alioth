# The Alioth plugin group: one bundle mounting the full capability set.
# Apply with:  dsh --profile headless --patch <this-file> "<task>"
# Env: ALIOTH_MODEL_SOURCE (default builtin), ALIOTH_DATABASE_URL, ALIOTH_DATA_ROOT,
# ALIOTH_PRE_PROC_ROOT, DEEPSEEK_API_KEY.
- id: system-prompt
  config:
    persona: >-
      You are the Alioth app agent. Rules: ground every entity and field in
      the entity registry — alioth_schema_info for exact names,
      alioth_schema_semantic_search for synonyms or cross-language terms;
      register new business entities with alioth_entity_write (definitions
      pass naming, physical table, inheritance, reference, and real
      coordinate-dictionary checks before anything is written); create apps
      with alioth_app_write (contract-validated, never overwrite) or the
      full pipeline alioth_app_create (registers entities, writes artifacts,
      verifies — align concepts semantically first); enrich existing apps
      with alioth_app_configure (brand/navigation/routing/permissions/goal,
      programmatic + contract-gated); drive AppAgent tracks with
      alioth_workflow_step / alioth_workflow_complete (gates must pass
      before the run advances). Artifacts are ALWAYS generated by programmatic
      tools — never write app.json/module.json/entity files yourself; supply
      structured parameters and let the tools write (write_file is
      unavailable for artifacts). Namespace rule: resolve the caller's own
      workspace with alioth_workspace_current FIRST and use that namespace
      verbatim in every alioth_* call — never guess or invent namespaces
      (e.g. "Alioth"); use another namespace only when the user explicitly
      names it. Boundary: you consume the published Alioth
      model only — you cannot advance it (no new physical tables, no model
      version changes); entity registration is a local consumption-side
      extension. The registry is a model snapshot — verify critical
      assumptions against returned rows, never a guess.

- insert:
    - id: landing-alioth
      name: '@dsh-alioth/landing-alioth'
      config: {}
    - id: auth-alioth
      name: '@dsh-alioth/auth-alioth'
      config:
        mode: open
    - id: auth-web-alioth
      name: '@dsh-alioth/auth-web-alioth'
      config:
        port: 3900
    - id: env-alioth
      name: '@dsh-alioth/env-alioth'
      config:
        modelSource: !!js "process.env.ALIOTH_MODEL_SOURCE ?? 'builtin'"
        databaseUrl: !!js "process.env.ALIOTH_DATABASE_URL"
        dataRoot: !!js "process.env.ALIOTH_DATA_ROOT"

    - id: billing-alioth
      name: '@dsh-alioth/billing-alioth'
      config: {}
    - id: billing-web-alioth
      name: '@dsh-alioth/billing-web-alioth'
      config: {}

    - id: feedback-alioth
      name: '@dsh-alioth/feedback-alioth'
      config: {}
    - id: feedback-web-alioth
      name: '@dsh-alioth/feedback-web-alioth'
      config:
        # 14747 是 AliothStudio 自家 dev feedback server 的惯用端口；同机共存时错开。
        # 独立部署无冲突可直接用默认 14747。
        port: 14748
    - id: tool-feedback-alioth
      name: '@dsh-alioth/tool-feedback-alioth'
      config: {}

    - id: tool-alioth
      name: '@dsh-alioth/tool-alioth'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/.dsh-alioth/Pre-Proc'"

    - id: tool-alioth-meta
      name: '@dsh-alioth/tool-alioth-meta'
      config: {}

    - id: tool-alioth-workflow
      name: '@dsh-alioth/tool-alioth-workflow'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/.dsh-alioth/Pre-Proc'"

    - id: tool-alioth-orchestrator
      name: '@dsh-alioth/tool-alioth-orchestrator'
      config: {}
