# The Alioth plugin group: one bundle mounting the full capability set.
# Apply with:  dsh --profile headless --patch <this-file> "<task>"
# Env: ALIOTH_MODEL_SOURCE (required), ALIOTH_DATABASE_URL, ALIOTH_DATA_ROOT,
# ALIOTH_PRE_PROC_ROOT, DEEPSEEK_API_KEY.
- id: system-prompt
  config:
    persona: >-
      You are the Alioth app agent. Rules: ground every entity and field in
      the entity registry — alioth_schema_info for exact names,
      alioth_schema_semantic_search for synonyms or cross-language terms;
      register new business entities with alioth_entity_write (definitions
      pass naming, physical table, inheritance, reference, and real
      coordinate-dictionary checks before anything is written); create apps
      with alioth_app_write (contract-validated, never overwrite) or the
      full pipeline alioth_app_create (registers entities, writes artifacts,
      verifies — align concepts semantically first); enrich existing apps
      with alioth_app_configure (brand/navigation/routing/permissions/goal,
      programmatic + contract-gated); drive AppAgent tracks with
      alioth_workflow_step / alioth_workflow_complete (gates must pass
      before the run advances); introspect the AppAgent flow with
      alioth_workflow_info — NEVER read adapter, vendor, or model-snapshot
      files with filesystem tools. Artifacts are ALWAYS generated by programmatic
      tools — never write app.json/module.json/entity files yourself; supply
      structured parameters and let the tools write (write_file is
      unavailable for artifacts). Namespace rule: resolve the caller's own
      workspace with alioth_workspace_current FIRST and use that namespace
      verbatim in every alioth_* call — never guess or invent namespaces
      (e.g. "Alioth"); use another namespace only when the user explicitly
      names it. Boundary: you consume the published Alioth
      model only — you cannot advance it (no new physical tables, no model
      version changes); entity registration is a local consumption-side
      extension. The registry is a model snapshot — verify critical
      assumptions against returned rows, never a guess. When alioth_schema_info
      reports degraded/[DDL-only] (this deployment has no registry rows), ground
      on the model's own DDL inventory — the tables and inheritance it returns —
      state that field-level metadata is unavailable, and do not read an empty
      result as "no such table".

# AppCreator workspace picker: the SPA 选择工作空间 browses the Alioth app
# tree instead of the filesystem (namespace → apps → pick an app). Patch
# semantics cannot rename a row (top-level REPLACE requires a matching name),
# so the harness directory-picker-auto row is disabled and our assembler is
# inserted under its own id (web profile only; headless trees have no such
# row — the disabled line is then a no-op skip).
- id: directory-picker
  disabled: true

# Right Sidebar: the harness Web terminal is NOT a product capability here.
# Upstream runs it through the Session's subprocess provider with the execution
# environment's system-user permissions — no Agent sandbox, no approval (Agent
# Note 2026-09-16-user-terminal-permissions) — which its own note justifies by
# "the person at the browser owns the machine". Our交付面 is multi-tenant B/S:
# every registered account would get a shell as the service user, able to read
# ~/.dsh-alioth.env (DSN), other accounts' Pre-Proc/U-*/ and psql into
# dsh_alioth_auth. Fail-closed: drop the tab type from the tree.
- id: ui-sidebar-terminal
  disabled: true

# …and neither must the browser read the app tree or hold a PTY. The two
# capabilities behind those tabs are unbounded by design, so a signed-in console
# user can reach them over the Remote regardless of which tabs are mounted:
#   * `workspace-files` — its own contract says absolute paths OUTSIDE the
#     workspace root are allowed, so `Sources/`, `app.json` and the deployment
#     env file are all listable/readable;
#   * `terminal-controller` — the browser half of the Web terminal (PTY as the
#     service user). The Agent's own terminal tools are a different package
#     (terminal/tool-terminal, sandboxed by Agent policy) and stay mounted.
# Source is a paid, time-limited download; the console shows prototypes only,
# through our own allowlisted /preview route (+ the 原型 tab's listing).
- id: workspace-files
  disabled: true
- id: ui-sidebar-files
  disabled: true
- id: ui-sidebar-documentpreview
  disabled: true
- id: terminal-controller
  disabled: true
# …nor the changed-files / delivery cards: `ui-deliverables` renders the files a
# turn touched (source included) and opens them through that same file Remote.
- id: ui-deliverables
  disabled: true

# …nor "open in application". The Host half (`open-in-app`) registers three
# webServer routes — probe `/open-in-app/apps`, per-app icon, and the
# `POST /open-in-app/open` launcher — and the launcher spawns the resolved
# desktop application ON THE SERVING HOST as the service user, on any absolute
# existing directory the caller names. Remotely that is not "the browser user's
# own machine" (the assumption upstream states for the Web terminal, Agent Note
# 2026-09-16-user-terminal-permissions): it is a process launcher on the
# deployment host, one click away for every signed-in account. Drop both halves
# — the routes and the browser split button / path actions
# (`ui-open-in-app`), which are a caller of those routes, not an independent
# capability; leaving the browser half mounted over dead routes would only
# render buttons that fail.
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true

- insert:
    - id: directory-picker-app
      name: '@dsh-alioth/app-picker'
      config:
        namespace: !!js "process.env.ALIOTH_PICKER_NAMESPACE"
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT" 

    - id: landing-alioth
      name: '@dsh-alioth/landing-alioth'
      config:
        # 备案号只上首页页脚（auth/用户中心三载体都支持 icp，按需在此装配）
        icp: !!js "process.env.ALIOTH_ICP"
    - id: auth-alioth
      name: '@dsh-alioth/auth-alioth'
      config:
        mode: open
    - id: auth-web-alioth
      name: '@dsh-alioth/auth-web-alioth'
      config:
        port: 3900
        # Reverse-proxied deployments name the public origin here (the harness
        # binds loopback, so the bind address is not the browser's origin).
        publicOrigin: !!js "process.env.ALIOTH_PUBLIC_ORIGIN"
    - id: env-alioth
      name: '@dsh-alioth/env-alioth'
      config:
        modelSource: !!js "process.env.ALIOTH_MODEL_SOURCE"
        databaseUrl: !!js "process.env.ALIOTH_DATABASE_URL"
        dataRoot: !!js "process.env.ALIOTH_DATA_ROOT"

    - id: billing-alioth
      name: '@dsh-alioth/billing-alioth'
      config:
        # L2 源码下载授权（商务对接开通，无自助通道）：username:YYYY-MM-DD 逗号分隔
        sourceLicenses: !!js "process.env.ALIOTH_SOURCE_LICENSES ?? ''"
    - id: billing-web-alioth
      name: '@dsh-alioth/billing-web-alioth'
      config: {}

    - id: page-feedback
      name: '@deepseek-ai/dsh-page-feedback'
      config: {}
    - id: feedback-web-alioth
      name: '@dsh-alioth/feedback-web-alioth'
      config:
        # 14747 是 AliothStudio 自家 dev feedback server 的惯用端口；同机共存时错开。
        # 独立部署无冲突可直接用默认 14747。
        port: 14748
    - id: tool-feedback-alioth
      name: '@dsh-alioth/tool-feedback-alioth'
      config: {}

    - id: tool-alioth
      name: '@dsh-alioth/tool-alioth'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/.dsh-alioth/Pre-Proc'"

    - id: tool-alioth-meta
      name: '@dsh-alioth/tool-alioth-meta'
      config: {}

    - id: tool-alioth-workflow
      name: '@dsh-alioth/tool-alioth-workflow'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/.dsh-alioth/Pre-Proc'"

    - id: tool-alioth-orchestrator
      name: '@dsh-alioth/tool-alioth-orchestrator'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/.dsh-alioth/Pre-Proc'"

    # Execution-surface guard: declared tool surface, write sandbox (namespace
    # scope + plan write narrowing), repair wall, turn budget, closure-evidence
    # nudge. Mounted after the tool plugins it polices.
    - id: guard-alioth
      name: '@dsh-alioth/guard-alioth'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/.dsh-alioth/Pre-Proc'"
        dataRoot: !!js "process.env.ALIOTH_DATA_ROOT ?? process.env.HOME + '/.dsh-alioth'"

    # Verification/closure tools: eval report + extension verification (declared-but-unwired),
    # closure audit, artifact versioning/rollback, two-stage asset patches, capability
    # advertisement, deferred blockers, session usage.
    - id: tool-alioth-verify
      name: '@dsh-alioth/tool-alioth-verify'
      config:
        preProcRoot: !!js "process.env.ALIOTH_PRE_PROC_ROOT ?? process.env.HOME + '/.dsh-alioth/Pre-Proc'"
